<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.54" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M2 2 L14 8 L2 14 Z" fill="#e2e8f0"/>
    </marker>
  </defs>

  <rect width="1672" height="941" fill="url(#bg)"/>
  <circle cx="148" cy="130" r="240" fill="#1e3a8a" opacity="0.25"/>
  <circle cx="1490" cy="800" r="270" fill="#0f766e" opacity="0.2"/>

  <text x="836" y="92" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="46" font-weight="700" fill="#f8fafc">复杂任务不能一路点继续</text>
  <text x="836" y="140" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="24" fill="#cbd5e1">每个阶段都要停下来检查方向，确认中间产物，再进入下一步</text>

  <path d="M118 684 C285 480 478 793 628 598 C770 414 898 306 1068 444 C1258 598 1324 293 1554 248" fill="none" stroke="#1e293b" stroke-width="62" stroke-linecap="round"/>
  <path d="M118 684 C285 480 478 793 628 598 C770 414 898 306 1068 444 C1258 598 1324 293 1554 248" fill="none" stroke="url(#road)" stroke-width="16" stroke-linecap="round" filter="url(#glow)" marker-end="url(#arrow)"/>
  <path d="M118 684 C285 480 478 793 628 598 C770 414 898 306 1068 444 C1258 598 1324 293 1554 248" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-dasharray="16 22" opacity="0.62"/>

  <g filter="url(#shadow)">
    <rect x="76" y="604" width="284" height="144" rx="24" fill="#f8fafc"/>
    <circle cx="116" cy="646" r="26" fill="#38bdf8"/>
    <text x="116" y="656" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff">1</text>
    <text x="156" y="642" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="27" font-weight="700" fill="#111827">目标澄清</text>
    <text x="116" y="697" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="22" fill="#475569">确认要去哪</text>
    <text x="116" y="728" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="22" fill="#475569">不要先踩油门</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="388" y="704" width="300" height="144" rx="24" fill="#f8fafc"/>
    <circle cx="428" cy="746" r="26" fill="#22c55e"/>
    <text x="428" y="756" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff">2</text>
    <text x="468" y="742" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="27" font-weight="700" fill="#111827">阶段计划</text>
    <text x="428" y="797" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="22" fill="#475569">拆成几段路</text>
    <text x="428" y="828" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="22" fill="#475569">每段有检查点</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="586" y="316" width="308" height="150" rx="24" fill="#f8fafc"/>
    <circle cx="626" cy="358" r="26" fill="#8b5cf6"/>
    <text x="626" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff">3</text>
    <text x="666" y="354" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="27" font-weight="700" fill="#111827">中间产物</text>
    <text x="626" y="409" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="22" fill="#475569">先看成果形态</text>
    <text x="626" y="440" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="22" fill="#475569">不要盲目继续</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="926" y="498" width="310" height="150" rx="24" fill="#f8fafc"/>
    <circle cx="966" cy="540" r="26" fill="#f59e0b"/>
    <text x="966" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff">4</text>
    <text x="1006" y="536" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="27" font-weight="700" fill="#111827">人工验收</text>
    <text x="966" y="591" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="22" fill="#475569">检查是否跑偏</text>
    <text x="966" y="622" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="22" fill="#475569">需要时立刻纠偏</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1270" y="184" width="320" height="156" rx="24" fill="#f8fafc"/>
    <circle cx="1310" cy="226" r="26" fill="#14b8a6"/>
    <text x="1310" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff">5</text>
    <text x="1350" y="222" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="27" font-weight="700" fill="#111827">继续执行</text>
    <text x="1310" y="277" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="22" fill="#475569">方向正确才前进</text>
    <text x="1310" y="308" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="22" fill="#475569">下一段继续验收</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="590" y="808" width="492" height="68" rx="34" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="836" y="852" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="27" font-weight="700" fill="#e2e8f0">Agent 负责加速，人负责掌舵</text>
  </g>
</svg>
