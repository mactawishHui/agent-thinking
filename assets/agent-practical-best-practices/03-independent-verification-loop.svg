<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">独立验证闭环</title>
  <desc id="desc">流程图展示开发 Agent 和验证 Agent 分离，验证 Agent 只拿目标功能进行自主验证，失败回到开发上下文修复，直到目标通过。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", Arial, sans-serif; letter-spacing: 0; }
    .title { font-size: 56px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 25px; font-weight: 400; fill: #475569; }
    .h { font-size: 33px; font-weight: 700; fill: #0f172a; }
    .p { font-size: 23px; font-weight: 400; fill: #475569; }
    .dark { font-size: 28px; font-weight: 700; fill: #f8fafc; }
    .label { font-size: 24px; font-weight: 700; fill: #0f766e; }
    .label-red { font-size: 24px; font-weight: 700; fill: #b91c1c; }
  </style>
  <rect width="1672" height="941" fill="url(#bg)"/>
  <text x="96" y="110" class="title">验证必须独立</text>
  <text x="100" y="155" class="subtitle">不能让同一个上下文既当选手又当裁判，验证只看目标功能是否成立</text>

  <g filter="url(#shadow)">
    <rect x="110" y="292" width="330" height="210" rx="28" fill="#ffffff"/>
    <rect x="590" y="292" width="330" height="210" rx="28" fill="#ffffff"/>
    <rect x="1232" y="292" width="330" height="210" rx="28" fill="#ffffff"/>
  </g>
  <text x="160" y="358" class="h">目标功能</text>
  <text x="160" y="408" class="p">只描述最终要验证</text>
  <text x="160" y="442" class="p">的用户目标</text>

  <text x="640" y="358" class="h">开发 Agent</text>
  <text x="640" y="408" class="p">实现功能</text>
  <text x="640" y="442" class="p">修复失败反馈</text>

  <text x="1282" y="358" class="h">验证 Agent</text>
  <text x="1282" y="408" class="p">独立上下文</text>
  <text x="1282" y="442" class="p">自主探索验证路径</text>

  <rect x="775" y="640" width="320" height="92" rx="46" fill="#0f766e" filter="url(#shadow)"/>
  <text x="935" y="698" text-anchor="middle" class="dark">目标通过才算完成</text>

  <path d="M440 397 L590 397" stroke="#0f766e" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M920 397 L1232 397" stroke="#0f766e" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M1397 502 C1397 612, 1215 686, 1095 686" stroke="#0f766e" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M775 686 C560 686, 500 502, 755 502" stroke="#dc2626" stroke-width="6" fill="none" marker-end="url(#arrow-red)"/>

  <rect x="1038" y="196" width="360" height="58" rx="29" fill="#fee2e2"/>
  <text x="1218" y="234" text-anchor="middle" class="label-red">不要给 checklist 让它打勾</text>
  <rect x="1066" y="538" width="332" height="58" rx="29" fill="#dcfce7"/>
  <text x="1232" y="576" text-anchor="middle" class="label">只给验证目标</text>
  <text x="835" y="822" text-anchor="middle" class="h">失败就回到开发上下文修复，再交给独立验证</text>
</svg>
