<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">复杂度和收益的取舍</title>
  <desc id="desc">决策图展示写代码和文档时要权衡改进幅度与复杂度成本，低收益高复杂度应删除，高收益低复杂度应保留。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#fefce8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", Arial, sans-serif; letter-spacing: 0; }
    .title { font-size: 56px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 25px; font-weight: 400; fill: #475569; }
    .h { font-size: 30px; font-weight: 700; fill: #0f172a; }
    .h-light { font-size: 30px; font-weight: 700; fill: #f8fafc; }
    .p { font-size: 22px; font-weight: 400; fill: #475569; }
    .axis { font-size: 24px; font-weight: 700; fill: #475569; }
  </style>
  <rect width="1672" height="941" fill="url(#bg)"/>
  <text x="96" y="110" class="title">Agent 越能写，人越要会删</text>
  <text x="100" y="155" class="subtitle">代码和文档的成本没有消失，只是从生成阶段转移到了 review 和维护阶段</text>

  <rect x="210" y="230" width="1252" height="610" rx="34" fill="#ffffff" filter="url(#shadow)"/>
  <line x1="360" y1="720" x2="1330" y2="720" stroke="#475569" stroke-width="5" marker-end="url(#arrow-x)"/>
  <line x1="360" y1="720" x2="360" y2="300" stroke="#475569" stroke-width="5" marker-end="url(#arrow-y)"/>
  <text x="820" y="790" text-anchor="middle" class="axis">复杂度成本增加</text>
  <text x="274" y="520" text-anchor="middle" class="axis" transform="rotate(-90 274 520)">改进幅度增加</text>

  <rect x="430" y="360" width="360" height="170" rx="26" fill="#dcfce7"/>
  <text x="610" y="420" text-anchor="middle" class="h">保留</text>
  <text x="610" y="466" text-anchor="middle" class="p">改进明显</text>
  <text x="610" y="500" text-anchor="middle" class="p">复杂度可接受</text>

  <rect x="890" y="360" width="360" height="170" rx="26" fill="#fef3c7"/>
  <text x="1070" y="420" text-anchor="middle" class="h">谨慎评估</text>
  <text x="1070" y="466" text-anchor="middle" class="p">收益高，但代价也高</text>
  <text x="1070" y="500" text-anchor="middle" class="p">必须证明必要性</text>

  <rect x="430" y="575" width="360" height="110" rx="26" fill="#e0f2fe"/>
  <text x="610" y="625" text-anchor="middle" class="h">可以保留简化</text>
  <text x="610" y="660" text-anchor="middle" class="p">收益接近不变，代码更清楚</text>

  <rect x="890" y="575" width="360" height="110" rx="26" fill="#fee2e2"/>
  <text x="1070" y="625" text-anchor="middle" class="h">删除</text>
  <text x="1070" y="660" text-anchor="middle" class="p">收益很小，复杂度很高</text>

  <rect x="1186" y="246" width="210" height="58" rx="29" fill="#0f766e"/>
  <text x="1291" y="284" text-anchor="middle" class="h-light">奥卡姆剃刀</text>
</svg>
