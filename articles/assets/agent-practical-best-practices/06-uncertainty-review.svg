<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">不确定性复盘</title>
  <desc id="desc">结构图展示 Agent 完成任务后，需要主动回答最不确定的三个点、被简化或跳过的部分，以及如果重做会修改什么。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", Arial, sans-serif; letter-spacing: 0; }
    .title { font-size: 56px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 25px; font-weight: 400; fill: #475569; }
    .h { font-size: 31px; font-weight: 700; fill: #0f172a; }
    .p { font-size: 23px; font-weight: 400; fill: #475569; }
    .dark { font-size: 32px; font-weight: 700; fill: #f8fafc; }
  </style>
  <rect width="1672" height="941" fill="url(#bg)"/>
  <text x="96" y="110" class="title">允许 Agent 暴露缺陷</text>
  <text x="100" y="155" class="subtitle">复杂任务不要求一次完美，更重要的是把不确定性从结果里挖出来</text>

  <rect x="596" y="286" width="480" height="250" rx="34" fill="#7c3aed" filter="url(#shadow)"/>
  <text x="836" y="380" text-anchor="middle" class="dark">已完成的方案或实现</text>
  <text x="836" y="428" text-anchor="middle" class="p" style="fill:#ede9fe">不要只看最终包装</text>
  <text x="836" y="464" text-anchor="middle" class="p" style="fill:#ede9fe">还要追问里面的风险</text>

  <g filter="url(#shadow)">
    <rect x="110" y="610" width="420" height="168" rx="28" fill="#ffffff"/>
    <rect x="626" y="610" width="420" height="168" rx="28" fill="#ffffff"/>
    <rect x="1142" y="610" width="420" height="168" rx="28" fill="#ffffff"/>
  </g>
  <text x="160" y="675" class="h">最不确定的三点</text>
  <text x="160" y="724" class="p">哪些地方判断不稳</text>
  <text x="160" y="758" class="p">需要后续重点验证</text>

  <text x="676" y="675" class="h">被简化或跳过的部分</text>
  <text x="676" y="724" class="p">哪些边界暂时没有处理</text>
  <text x="676" y="758" class="p">哪些假设没有被验证</text>

  <text x="1192" y="675" class="h">重做会修改什么</text>
  <text x="1192" y="724" class="p">让 Agent 主动提出</text>
  <text x="1192" y="758" class="p">更好的下一轮方案</text>

  <path d="M720 536 C590 580, 455 580, 320 610" stroke="#7c3aed" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M836 536 L836 610" stroke="#7c3aed" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M952 536 C1082 580, 1217 580, 1352 610" stroke="#7c3aed" stroke-width="6" fill="none" marker-end="url(#arrow)"/>

  <rect x="420" y="232" width="832" height="58" rx="29" fill="#ede9fe"/>
  <text x="836" y="270" text-anchor="middle" class="h">给它承认问题的空间，风险才会浮上来</text>
</svg>
