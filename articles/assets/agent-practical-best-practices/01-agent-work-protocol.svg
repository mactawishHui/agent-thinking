<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Agent 工作协议总览</title>
  <desc id="desc">结构图展示使用 Agent 的六条实践原则，需求澄清、边界定义、分阶段推进、独立验证、复杂度控制和不确定性复盘组成一个闭环。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.52" stop-color="#eef6f1"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", Arial, sans-serif; letter-spacing: 0; }
    .title { font-size: 58px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 25px; font-weight: 400; fill: #475569; }
    .box-title { font-size: 30px; font-weight: 700; fill: #0f172a; }
    .box-text { font-size: 22px; font-weight: 400; fill: #475569; }
    .center-title { font-size: 42px; font-weight: 700; fill: #f8fafc; }
    .center-text { font-size: 24px; font-weight: 400; fill: #ccfbf1; }
    .num { font-family: Arial, sans-serif; font-size: 28px; font-weight: 800; fill: #0f766e; }
  </style>
  <rect width="1672" height="941" fill="url(#bg)"/>
  <circle cx="1460" cy="160" r="230" fill="#14b8a6" opacity="0.08"/>
  <circle cx="210" cy="780" r="270" fill="#f59e0b" opacity="0.08"/>

  <text x="96" y="110" class="title">使用 Agent，需要设计工作协议</text>
  <text x="100" y="155" class="subtitle">真正稳定的协作来自一套可澄清、可约束、可验证、可复盘的工作协议</text>

  <rect x="632" y="300" width="408" height="246" rx="34" fill="#0f766e" filter="url(#shadow)"/>
  <text x="836" y="390" text-anchor="middle" class="center-title">Agent 工作闭环</text>
  <text x="836" y="438" text-anchor="middle" class="center-text">目标、边界、验证、反馈</text>
  <text x="836" y="482" text-anchor="middle" class="center-text">都必须被显式设计</text>

  <g filter="url(#shadow)">
    <rect x="104" y="260" width="370" height="132" rx="24" fill="#ffffff"/>
    <rect x="104" y="448" width="370" height="132" rx="24" fill="#ffffff"/>
    <rect x="104" y="636" width="370" height="132" rx="24" fill="#ffffff"/>
    <rect x="1198" y="260" width="370" height="132" rx="24" fill="#ffffff"/>
    <rect x="1198" y="448" width="370" height="132" rx="24" fill="#ffffff"/>
    <rect x="1198" y="636" width="370" height="132" rx="24" fill="#ffffff"/>
  </g>

  <text x="136" y="315" class="num">01</text>
  <text x="188" y="315" class="box-title">先问清需求</text>
  <text x="188" y="354" class="box-text">一问一答，把模糊想法</text>
  <text x="188" y="385" class="box-text">变成可执行目标</text>

  <text x="136" y="503" class="num">02</text>
  <text x="188" y="503" class="box-title">开发验证分离</text>
  <text x="188" y="542" class="box-text">不能让同一个上下文</text>
  <text x="188" y="573" class="box-text">既当选手又当裁判</text>

  <text x="136" y="691" class="num">03</text>
  <text x="188" y="691" class="box-title">写清不能做什么</text>
  <text x="188" y="730" class="box-text">防止范围膨胀、假数据</text>
  <text x="188" y="761" class="box-text">和 mock 流程伪装完成</text>

  <text x="1230" y="315" class="num">04</text>
  <text x="1282" y="315" class="box-title">分阶段验收</text>
  <text x="1282" y="354" class="box-text">每个交付批次停下来</text>
  <text x="1282" y="385" class="box-text">让人确认方向</text>

  <text x="1230" y="503" class="num">05</text>
  <text x="1282" y="503" class="box-title">压住复杂度</text>
  <text x="1282" y="542" class="box-text">用奥卡姆剃刀约束</text>
  <text x="1282" y="573" class="box-text">代码和文档的膨胀</text>

  <text x="1230" y="691" class="num">06</text>
  <text x="1282" y="691" class="box-title">暴露不确定性</text>
  <text x="1282" y="730" class="box-text">让 Agent 说出漏洞、</text>
  <text x="1282" y="761" class="box-text">跳过点和重做建议</text>

  <path d="M474 326 C560 326, 560 360, 632 378" fill="none" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M474 514 C560 514, 560 480, 632 466" fill="none" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M474 702 C560 702, 565 575, 632 520" fill="none" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1040 378 C1112 360, 1112 326, 1198 326" fill="none" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1040 466 C1112 480, 1112 514, 1198 514" fill="none" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1040 520 C1107 575, 1112 702, 1198 702" fill="none" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="474" y="808" width="724" height="58" rx="29" fill="#ecfdf5"/>
  <text x="836" y="846" text-anchor="middle" class="box-title" font-size="26">目标是让结果持续可控</text>
</svg>
