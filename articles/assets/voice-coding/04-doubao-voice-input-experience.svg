<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">豆包输入法体验点</title>
  <desc id="desc">结构图展示作者使用豆包输入法进行 Voice Coding 时感受到的五个体验点，同步输入、长时间转录、口语整理、说话人识别和中英文混合识别。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", Arial, sans-serif; letter-spacing: 0; }
    .title { font-size: 56px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 25px; font-weight: 400; fill: #475569; }
    .h { font-size: 32px; font-weight: 700; fill: #0f172a; }
    .p { font-size: 23px; font-weight: 400; fill: #475569; }
    .num { font-family: Arial, sans-serif; font-size: 30px; font-weight: 800; fill: #0f766e; }
    .center { font-size: 36px; font-weight: 700; fill: #f8fafc; }
  </style>
  <rect width="1672" height="941" fill="url(#bg)"/>
  <text x="96" y="110" class="title">真正好用的语音输入，要服务长对话</text>
  <text x="100" y="155" class="subtitle">Voice Coding 需要持续表达、实时反馈、准确识别和轻度整理</text>

  <rect x="608" y="330" width="456" height="210" rx="36" fill="#0f766e" filter="url(#shadow)"/>
  <text x="836" y="410" text-anchor="middle" class="center">豆包输入法体验</text>
  <text x="836" y="462" text-anchor="middle" class="center">适合和 Agent 长聊</text>

  <g filter="url(#shadow)">
    <rect x="112" y="260" width="390" height="140" rx="26" fill="#ffffff"/>
    <rect x="112" y="520" width="390" height="140" rx="26" fill="#ffffff"/>
    <rect x="641" y="650" width="390" height="140" rx="26" fill="#ffffff"/>
    <rect x="1170" y="260" width="390" height="140" rx="26" fill="#ffffff"/>
    <rect x="1170" y="520" width="390" height="140" rx="26" fill="#ffffff"/>
  </g>

  <text x="152" y="320" class="num">01</text>
  <text x="214" y="320" class="h">同步输入</text>
  <text x="214" y="362" class="p">边说边看到文字出现</text>

  <text x="152" y="580" class="num">02</text>
  <text x="214" y="580" class="h">长时间转录</text>
  <text x="214" y="622" class="p">适合三五分钟讲需求</text>

  <text x="681" y="710" class="num">03</text>
  <text x="743" y="710" class="h">整理口语</text>
  <text x="743" y="752" class="p">清掉停顿，保留原意</text>

  <text x="1210" y="320" class="num">04</text>
  <text x="1272" y="320" class="h">识别说话人</text>
  <text x="1272" y="362" class="p">嘈杂环境里更可用</text>

  <text x="1210" y="580" class="num">05</text>
  <text x="1272" y="580" class="h">中英文混合</text>
  <text x="1272" y="622" class="p">技术词和缩写更稳</text>

  <path d="M502 330 C560 330, 570 380, 608 410" stroke="#0f766e" stroke-width="5" fill="none"/>
  <path d="M502 590 C560 590, 570 505, 608 470" stroke="#0f766e" stroke-width="5" fill="none"/>
  <path d="M836 650 L836 540" stroke="#0f766e" stroke-width="5" fill="none"/>
  <path d="M1170 330 C1112 330, 1102 380, 1064 410" stroke="#0f766e" stroke-width="5" fill="none"/>
  <path d="M1170 590 C1112 590, 1102 505, 1064 470" stroke="#0f766e" stroke-width="5" fill="none"/>
</svg>
