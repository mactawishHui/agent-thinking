<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#182033"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="stage1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="stage2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="stage3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M2 2 L14 8 L2 14 Z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect width="1672" height="941" rx="0" fill="url(#bg)"/>
  <circle cx="182" cy="142" r="220" fill="#1e293b" opacity="0.55"/>
  <circle cx="1480" cy="794" r="260" fill="#0f766e" opacity="0.16"/>
  <path d="M92 792 C420 650 580 805 827 678 C1105 535 1192 244 1586 194" fill="none" stroke="#334155" stroke-width="3" opacity="0.55"/>

  <text x="836" y="94" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="46" font-weight="700" fill="#f8fafc">我使用 Agent 的三个阶段</text>
  <text x="836" y="142" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="24" fill="#cbd5e1">从放手让它跑，到在动手前把需求聊清楚</text>

  <g filter="url(#shadow)">
    <rect x="80" y="222" width="430" height="548" rx="28" fill="#f8fafc"/>
    <rect x="80" y="222" width="430" height="92" rx="28" fill="url(#stage1)"/>
    <text x="116" y="280" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">阶段一：一直同意</text>
    <circle cx="432" cy="268" r="32" fill="#fff" opacity="0.92"/>
    <path d="M418 268 l10 10 l20 -24" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="116" y="366" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">典型动作</text>
    <text x="116" y="410" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="24" fill="#334155">Agent 问什么都点同意</text>
    <text x="116" y="448" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="24" fill="#334155">计划看着差不多就继续</text>
    <text x="116" y="486" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="24" fill="#334155">一路放它从起点跑到终点</text>

    <line x1="116" y1="530" x2="474" y2="530" stroke="#e2e8f0" stroke-width="2"/>
    <text x="116" y="584" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">结果</text>
    <text x="116" y="628" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="24" fill="#334155">它做了很多</text>
    <text x="116" y="666" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="24" fill="#334155">但方向可能从一开始就错了</text>
    <rect x="116" y="700" width="330" height="42" rx="21" fill="#fee2e2"/>
    <text x="281" y="729" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#991b1b">只踩油门，不握方向盘</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="621" y="222" width="430" height="548" rx="28" fill="#f8fafc"/>
    <rect x="621" y="222" width="430" height="92" rx="28" fill="url(#stage2)"/>
    <text x="657" y="280" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">阶段二：做完再改</text>
    <circle cx="973" cy="268" r="32" fill="#fff" opacity="0.92"/>
    <path d="M957 282 C974 255 990 255 1007 282" fill="none" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round"/>
    <circle cx="967" cy="260" r="4" fill="#8b5cf6"/>
    <circle cx="997" cy="260" r="4" fill="#8b5cf6"/>

    <text x="657" y="366" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">典型动作</text>
    <text x="657" y="410" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="24" fill="#334155">成品不对，人开始补锅</text>
    <text x="657" y="448" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="24" fill="#334155">代码、文档、风格都自己修</text>
    <text x="657" y="486" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="24" fill="#334155">再让它反复迭代修改</text>

    <line x1="657" y1="530" x2="1015" y2="530" stroke="#e2e8f0" stroke-width="2"/>
    <text x="657" y="584" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">结果</text>
    <text x="657" y="628" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="24" fill="#334155">上下文越来越长</text>
    <text x="657" y="666" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="24" fill="#334155">补丁越来越多，主线越来越虚</text>
    <rect x="657" y="700" width="316" height="42" rx="21" fill="#fef3c7"/>
    <text x="815" y="729" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#92400e">返工成本开始变高</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1162" y="222" width="430" height="548" rx="28" fill="#f8fafc"/>
    <rect x="1162" y="222" width="430" height="92" rx="28" fill="url(#stage3)"/>
    <text x="1198" y="280" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">阶段三：先问清楚</text>
    <circle cx="1514" cy="268" r="32" fill="#fff" opacity="0.92"/>
    <path d="M1498 268 l12 12 l24 -28" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="1198" y="366" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">典型动作</text>
    <text x="1198" y="410" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="24" fill="#334155">先聊目标、边界和验收</text>
    <text x="1198" y="448" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="24" fill="#334155">让 Agent 一次一个问题追问</text>
    <text x="1198" y="486" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="24" fill="#334155">确认阶段计划，再开始执行</text>

    <line x1="1198" y1="530" x2="1556" y2="530" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1198" y="584" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">结果</text>
    <text x="1198" y="628" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="24" fill="#334155">误解在动手前暴露</text>
    <text x="1198" y="666" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="24" fill="#334155">执行阶段更稳，返工更少</text>
    <rect x="1198" y="700" width="326" height="42" rx="21" fill="#dcfce7"/>
    <text x="1361" y="729" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#166534">先定方向，再踩油门</text>
  </g>

  <line x1="534" y1="496" x2="596" y2="496" stroke="#cbd5e1" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1075" y1="496" x2="1137" y2="496" stroke="#cbd5e1" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="354" y="823" width="964" height="64" rx="32" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="836" y="864" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Arial, sans-serif" font-size="26" font-weight="700" fill="#e2e8f0">真正的转变：不是让 Agent 少问，而是让它在动手前问够</text>
</svg>
